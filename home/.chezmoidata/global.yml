githubUsername: markkpamy
externalGitArgs: "clone.args = ['--depth', '1']\npull.args = ['--depth', '1']"
isDockerInstallMode: false

# Bitwarden utilities configuration
bitwarden:
  enabled: true
  auto_install: true
  # The BWS access token is read from the OS keystore (chezmoi secret keyring):
  # Windows Credential Manager, Secret Service on Linux, Keychain on macOS.
  keyring_service: 'bws'
  keyring_user: 'access-token'
  # Fallback when the keystore has no token: the vault item holding it.
  token_item: 'BWS Access Token'
  storage_method: 'login'
  default_project: '' # Set your default BWS project ID
  auto_lock_timeout: '15m'

  aliases:
    docker_secure: true

  # AWS-specific Bitwarden settings (using BW CLI)
  aws:
    item_name: 'AWS Default Profile' # For BW CLI (not used with new approach)

#  item_mappings:
#    database: 'Production Database'
#    api_key: 'Main API Key'
#    redis: 'Redis Password'
