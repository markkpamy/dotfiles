pkgs:
  windows:
    # Scoop is the default for portable CLI tools: every app is exposed through
    # the single ~\scoop\shims PATH entry. User-scope WinGet portable installs add
    # one ~100-char PATH entry per package instead, and once Machine + User PATH
    # passes ~4095 chars Explorer silently drops the whole User PATH when it
    # refreshes the environment (every tool "disappears" in new terminals).
    scoop:
      buckets:
        - 'main'
        - 'extras'
      #        - 'nonportable'
      #        - 'sysinternals'
      #        - 'nerd-fonts'
      #        - 'versions'
      # - 'neorocks-scoop' # https://github.com/nvim-neorocks/rocks-scoop.git
      pkgs:
        # Languages and runtimes
        - 'mise'
        - 'fnm'
        - 'bun' # adds ~\scoop\persist\bun\bin to PATH for `bun add -g`
        # Shells and terminal
        - 'psmux' # tmux for Windows
        - 'atuin' # Better shell history
        # Essentials
        - 'bitwarden-cli'
        - 'openssl' # adds its bin dir to PATH
        - 'extras/age'
        - 'aws-vault'
        # CLI tools
        - 'bat'
        - 'delta'
        - 'eza'
        - 'fd'
        - 'fzf'
        - 'jq'
        - 'ripgrep'
        - 'zoxide'
        - 'xh'
        - 'glow'
        - 'hexyl'
        - 'just'
        - 'btop' # btop4win
        - 'git-cliff'
        # DevOps tools
        - 'gitleaks'
        - 'k9s'
        # Completion (keep in Scoop as not available in Winget)
      #        - 'extras/dockercompletion'
      #        - 'extras/scoop-completion'
      #        - 'macchina'

      importRegistry:
      # - "$env:USERPROFILE\scoop\apps\windows-terminal\current\install-context.reg"
    #        - '$env:USERPROFILE\scoop\apps\pwsh\current\install-explorer-context.reg'
    #        - '$env:USERPROFILE\scoop\apps\pwsh\current\install-file-context.reg'
    #        - '$env:USERPROFILE\scoop\apps\7zip\current\install-context.reg'
