# psmux configuration (native Windows tmux)
# Reads tmux syntax. Linux/macOS keep using oh-my-tmux in ~/.config/tmux.
# Docs: https://github.com/psmux/psmux/blob/master/docs/configuration.md

# ---------------------------------------------------------------- General
set -g default-shell "pwsh"
set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"

# Number windows and panes from 1, renumber on close
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ---------------------------------------------------------------- Prefix
# Keep C-b and add C-a as a secondary prefix (same as oh-my-tmux)
set -g prefix2 C-a
bind C-a send-prefix -2

# Reload config
bind r source-file ~/.config/psmux/psmux.conf \; display-message "psmux.conf reloaded"

# ---------------------------------------------------------------- Panes & windows
# Split in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------- Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ---------------------------------------------------------------- Theme (Catppuccin Mocha)
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%Y-%m-%d #[fg=#cdd6f4,bold]%H:%M "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#f5c2e7,bold] #I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
